[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marginal"
version = "0.1.0"
description = "The Open Source Engineering Intelligence Agent for Pull Requests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Eslem Karakaş" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/exactml/marginal"
Repository = "https://github.com/exactml/marginal"
Issues = "https://github.com/exactml/marginal/issues"

[project.scripts]
marginal = "marginal.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
dev = ["ruff>=0.6", "pytest>=8", "pytest-asyncio>=0.24", "anthropic>=0.34", "openai>=1.40"]

[tool.setuptools.packages.find]
include = ["marginal*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
