name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # The exact dependency versions this release is tested with, attached to the
  # release so marginal-action installs them when a team pins this version.
  constraints:
    runs-on: ubuntu-latest
    # Read-only: this job runs third-party code (installs and tests). The upload
    # that needs write access is its own job below.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          # marginal-action's default Python, so the file matches what a pinned run installs.
          python-version: "3.11"

      - name: Install the release with every extra and freeze it
        run: |
          pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/release"
          "$RUNNER_TEMP/release/bin/pip" install "$(ls dist/*.whl)[anthropic,openai,oic]"
          "$RUNNER_TEMP/release/bin/pip" freeze --exclude marginal-review > constraints.txt
          cat constraints.txt

      - name: Test against those versions
        run: |
          "$RUNNER_TEMP/release/bin/pip" install pytest pytest-asyncio
          "$RUNNER_TEMP/release/bin/pytest"

      - uses: actions/upload-artifact@v7
        with:
          name: constraints
          path: constraints.txt

  attach-constraints:
    needs: constraints
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: constraints

      - name: Attach constraints.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" constraints.txt --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    # A release whose tests fail against its own constraints never reaches PyPI.
    needs: attach-constraints
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/marginal-review/
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
