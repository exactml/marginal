name: marginal

on:
  pull_request:
    # ready_for_review: a draft is skipped (review.skip_drafts), so review it
    # once it's marked ready rather than waiting for the next push.
    # closed: a merged PR posts its knowledge proposal.
    types: [opened, synchronize, reopened, ready_for_review, closed]

# One review per PR at a time: two runs started by quick successive pushes
# would each miss the other's review and post the same header twice.
concurrency:
  group: marginal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      # Resolving a review thread (marginal closes ones a later push fixed)
      # needs contents: write; marginal never pushes.
      contents: write
    steps:
      - uses: exactml/marginal-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  # Knowledge proposal (ADR 0011): deterministic, no model call. marginal-action
  # runs `marginal propose` on a merged PR and skips a fork's, whose token can't
  # post.
  propose:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    # No concurrency group: one keeps a single waiting run and cancels it for a
    # newer one, so a merged PR could lose its proposal comment.
    permissions:
      pull-requests: write
      # `write` with permissions.write.push, to add to the rolling knowledge PR.
      contents: read
    steps:
      - uses: exactml/marginal-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
