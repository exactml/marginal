name: Review quality

on:
  # Runs only on release PRs (release/v*), see the job's `if`: the benchmark
  # calls the model and costs money, so it doesn't run on every PR. Not on
  # synchronize: cut-release pushes the new baseline.json to the release PR,
  # and that push shouldn't pay for a second run.
  pull_request:
    branches: [master]
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA of marginal to benchmark
        default: master

permissions:
  contents: read

jobs:
  review-quality:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty on pull_request, so the PR's own commit is checked out.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # A crash here fails the job, so a broken run is never mistaken for a score.
      - name: Run benchmark
        run: make review-quality
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Soft gate: a drop in scores warns in the summary, never fails the job.
      - name: Compare with baseline
        continue-on-error: true
        run: python tests/integration/review_quality/score.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: review-quality
          path: tests/integration/review_quality/score.json
          if-no-files-found: warn
