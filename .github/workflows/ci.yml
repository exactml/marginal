name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to a PR cancels its older run. Each master commit gets its own
# group, so a quick run of merges can't cancel a queued run and leave a
# commit without a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: make test

  # The protect-main ruleset requires this check. always() makes it report a
  # failure when lint or test fails; without it, it would be skipped, and a
  # skipped job counts as passing.
  lint-and-test:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and test to pass
        run: |
          echo "lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ]
