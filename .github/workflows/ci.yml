name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to a PR cancels its older run. Runs on master are never
# cancelled, so every merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required by the protect-main ruleset, so it must always run and report:
  # a docs-only PR passes after the change check instead of being skipped,
  # which would leave the PR waiting for the check forever.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -qvE '^(docs/|changelog\.d/)|^[^/]+\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, changelog fragments or top-level Markdown changed; skipping lint and tests."
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pip install -e ".[dev]"

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: make lint

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: make test
