name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to a PR cancels its older run. Each master commit gets its own
# group, so a quick run of merges can't cancel a queued run and leave a
# commit without a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On its own line so a failed diff fails the job instead of
          # looking like a docs-only change. --no-renames lists a moved
          # file's old path too, so moving code into docs/ still counts.
          changed=$(git diff --name-only --no-renames "origin/$BASE_REF...HEAD")
          if grep -qvE '^(docs/|changelog\.d/)|^[^/]+\.md$' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, changelog fragments or top-level Markdown changed; skipping lint and tests."
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: make test

  # The protect-main ruleset requires this check, so it always runs and
  # reports: it passes when lint and test passed, or were skipped on a
  # docs-only PR, and fails otherwise.
  lint-and-test:
    needs: [changes, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and test to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, lint, test: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
