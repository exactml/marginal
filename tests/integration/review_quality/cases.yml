- id: build-env-cert-disables-truststore
  upstream: pypa/pip
  base: 420435903ff2fc694d6950a47b896427ecaed78f
  head: 511000d738e6ee3230ad53e79762b68cc9bcc816
  kind: reversal
  merged: '2024-12-14'
  source: https://github.com/pypa/pip/pull/13063
  evidence: https://github.com/pypa/pip/pull/13195
  why: Always passes --cert to the nested pip that installs build dependencies, which turns truststore off there, so
    system certificates are never used for them.
  accepted:
  - kind: decision
    about: src/pip/_internal/build_env.py
    statement: When installing build dependencies into the isolated BuildEnvironment, any target directory from pip.conf
      or environment variables is ignored (empty --target passed) because the build env specifies its own prefix and
      combining them crashes setuptools installation.
    pr: 12744
    source: src/pip/_internal/build_env.py:246
  - kind: decision
    about: src/pip/_internal/build_env.py
    statement: Build-environment pip subprocesses mirror the parent's verbosity level, so -vv is forwarded as -vv
      (not downgraded to -v) to ensure debug output covers build dependency installs.
    pr: 12578
    source: src/pip/_internal/build_env.py:251
  - kind: decision
    about: src/pip/_internal/
    statement: On Python 3.10 or later, HTTPS is verified with system certificates (truststore) as well as certifi
      by default; passing --cert turns truststore off.
    pr: 11647
    source: docs/html/topics/https-certificates.md:31
    broken: true
  - kind: decision
    about: src/pip/_internal/build_env.py
    statement: Build env isolation excludes paths from site.getsitepackages(), but falls back to purelib/platlib when
      that function is missing because virtualenv<20 replaces site.py without it.
    pr: 11466
    source: src/pip/_internal/build_env.py:73
  must_find:
  - file: src/pip/_internal/build_env.py
    lines:
    - 249
    - 250
    severity: medium
  must_propose:
  - kind: rule
    file: news/5502.bugfix.rst
    lines:
    - 1
    - 2
    statement: The configured TLS server and client certificates are used when pip installs build dependencies
      in the isolated build environment.
