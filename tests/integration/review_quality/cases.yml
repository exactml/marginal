# Benchmark cases: real upstream PRs pinned by SHA, each with an answer key.
# A hit is a finding in a must_find file with its line inside `lines`; a
# finding inside must_not_flag, or anywhere on a `clean` case, is a false
# positive; anything else is unlabeled and listed for a person to judge.
config: marginal-config.yaml

# Every attempt reviews every case: a review tool, and the provider and model
# it calls. Scores are kept per attempt.
attempts:
  - {tool: marginal, provider: anthropic, model: claude-opus-5-5}
  # PR-Agent (MIT) on the same model and key, in its plain-diff mode.
  - {tool: pr-agent, provider: anthropic, model: claude-opus-5-5}

cases:
- id: missing-auth-on-camelcase-alias
  upstream: mlflow/mlflow
  base: 51846bf4363a9206d3bc22c8bc87188b66e920fe
  head: 4bb7474771c3be808cd9e129defef9305f2869be
  kind: security
  merged: '2026-07-06'
  source: https://github.com/mlflow/mlflow/pull/24293
  evidence: https://github.com/mlflow/mlflow/pull/25892
  why: The new source-read check only looks for run_id/model_id under their snake_case keys, but the handler
    also accepts runId/modelId, so a camelCase body skips the READ check.
  must_find:
  - file: mlflow/server/auth/__init__.py
    lines:
    - 1184
    - 1192
    severity: high
  must_not_flag: []
- id: unset-proto-field-treated-as-zero
  upstream: mlflow/mlflow
  base: f4f92549e194a80746d85b1e869fe552457525e6
  head: bf9147937e2648af5f1740a388edd52b2bc20592
  kind: logic
  merged: '2025-06-20'
  source: https://github.com/mlflow/mlflow/pull/16325
  evidence: https://github.com/mlflow/mlflow/pull/23917
  why: An unset proto2 int reads as 0, never None, so the `is not None` check always passes and a request without max_results
    sends max_results=0 to the store.
  must_find:
  - file: mlflow/server/handlers.py
    lines:
