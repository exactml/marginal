- id: fish-completion-splits-on-unquoted-newline
  upstream: pallets/click
  base: c69643b60cf971cd5d8e5d3902632807ceab9b8f
  head: 19fd4d6e18bc9fce451f92f422696b11169faa57
  kind: logic
  merged: '2026-04-29'
  source: https://github.com/pallets/click/pull/3126
  evidence: https://github.com/pallets/click/pull/3504
  why: The fish script splits each completion on an unquoted \n, which becomes a literal line break in
    the generated script, and the newline-framed output is flattened by fish command substitution, so
    fish completion breaks.
