- id: async-login-leaves-stale-request-user
  upstream: django/django
  base: 117f90dea53b0dd121eb14f07bcbadb295665ff7
  head: 31a43c571f4d036827d4fd7a5f615591637dc1be
  kind: logic
  merged: '2025-08-08'
  source: https://github.com/django/django/pull/19709
  evidence: https://github.com/django/django/pull/21045
  why: alogin()/alogout() stop updating request.user (only request.auser is replaced), so if request.user
    was read earlier in the request, it still holds the previous user afterwards.
  must_find:
  - file: django/contrib/auth/__init__.py
    lines:
    - 237
    - 242
    severity: medium
  - file: django/contrib/auth/__init__.py
    lines:
    - 279
    - 282
    severity: medium
  must_not_flag: []
  accepted:
  - kind: rule
    about: django/contrib/auth/__init__.py
    statement: To avoid reusing another user's session, login creates a new, empty session if the existing session
      belongs to a different authenticated user.
    pr: 18036
    source: django/contrib/auth/__init__.py:225
  - kind: decision
    about: django/contrib/auth/__init__.py
    statement: When a session is accepted using a fallback secret, the session key is cycled and the stored hash is
      re-signed with the current SECRET_KEY, so the session stays valid after the fallback key is removed.
    pr: 16631
    source: django/contrib/auth/__init__.py:193
  - kind: rule
    about: django/contrib/auth/__init__.py
    statement: logout() no longer preserves the session's language after logout; language persistence relies on the
      LANGUAGE_COOKIE_NAME cookie instead.
    pr: 10875
    source: docs/releases/3.0.txt:537
  - kind: rule
    about: django/contrib/auth/__init__.py
    statement: If a backend raises PermissionDenied, authentication stops immediately and no further backends are
      tried; that user must not be allowed in at all.
    source: django/contrib/auth/__init__.py:116
  must_propose: []
