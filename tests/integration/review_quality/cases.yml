- id: new-required-kwarg-breaks-direct-responder-use
  upstream: Kludex/starlette
  base: 5567e274c8c4a0811fb3bc602c3b6631571b8e80
  head: cb824a1c7d67924fc762bfc12359139892385b18
  kind: caller
  merged: '2026-08-05'
  source: https://github.com/Kludex/starlette/pull/3410
  evidence: https://github.com/Kludex/starlette/pull/3415
  why: GZipResponder.__init__ gains a required keyword-only thread_minimum_size with no default, so any
    code constructing GZipResponder directly now raises TypeError.
  must_find:
  - file: starlette/middleware/gzip.py
    lines:
    - 155
    - 156
    severity: medium
  must_not_flag: []
  valid_extra:
  - file: starlette/middleware/gzip.py
    lines:
    - 138
    - 140
  - file: starlette/middleware/gzip.py
    lines:
    - 170
    - 175
  accepted:
  - kind: rule
    about: docs/middleware.md
    statement: GZipMiddleware won't compress responses that already have a Content-Encoding (no double encoding) or
      are text/event-stream (server-sent events).
    pr: 2880
    source: docs/middleware.md:245
  - kind: rule
    about: starlette/middleware/gzip.py
    statement: Server-sent event responses (content type text/event-stream) are never gzip-compressed by GZipMiddleware,
      even when the client accepts gzip.
    pr: 2871
    source: starlette/middleware/gzip.py:9
  - kind: decision
    about: starlette/middleware/gzip.py
    statement: 'Responses that are large enough to compress get a `Vary: Accept-Encoding` header even when the client
      did not ask for gzip, so caches store the compressed and uncompressed versions separately.'
    pr: 2865
    source: starlette/middleware/gzip.py:28
  - kind: decision
    about: starlette/middleware/gzip.py
    statement: GZip is not applied to pathsend responses.
    pr: 2671
    source: starlette/middleware/gzip.py:106
  must_propose:
  - kind: decision
    file: docs/middleware.md
    lines:
    - 244
    - 244
    statement: Body chunks of at least thread_minimum_size (default 128 KiB) are compressed in a worker
      thread; smaller ones compress inline since thread dispatch cost would dominate.
  - kind: decision
    file: starlette/middleware/gzip.py
    lines:
    - 21
    - 22
    statement: GZip compression uses its own capacity limiter, isolated from AnyIO's default worker-thread
      limiter but matching its default concurrency (40).
