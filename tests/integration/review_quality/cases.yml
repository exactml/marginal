    - 183
    severity: high
  - file: src/click/shell_completion.py
    lines:
    - 436
    - 436
    severity: high
  must_not_flag: []
  accepted:
  - kind: decision
    about: src/click/shell_completion.py
    statement: The zsh completion script is widely deployed, so it is frozen; colon handling is done in
      ZshComplete.format_completion instead.
    source: src/click/shell_completion.py:131
  - kind: decision
    about: src/click/shell_completion.py
    statement: Since shells treat '=' between a long option and its value differently, completion always
