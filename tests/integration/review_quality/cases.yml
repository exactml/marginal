# Benchmark cases: real upstream PRs pinned by SHA, each with an answer key.
# A hit is a finding in a must_find file with its line inside `lines`; a
# finding inside must_not_flag, or anywhere on a `clean` case, is a false
# positive; anything else is unlabeled and listed for a person to judge.
config: marginal-config.yaml

# Every attempt reviews every case: a review tool, and the provider and model
# it calls. Scores are kept per attempt.
attempts:
  - {tool: marginal, provider: anthropic, model: claude-opus-5-5}
  # PR-Agent (MIT) on the same model and key, in its plain-diff mode.
  - {tool: pr-agent, provider: anthropic, model: claude-opus-5-5}

cases:
- id: missing-auth-on-camelcase-alias
  upstream: mlflow/mlflow
  base: 51846bf4363a9206d3bc22c8bc87188b66e920fe
  head: 4bb7474771c3be808cd9e129defef9305f2869be
  kind: security
  merged: '2026-07-06'
  source: https://github.com/mlflow/mlflow/pull/24293
  evidence: https://github.com/mlflow/mlflow/pull/25892
  why: The new source-read check only looks for run_id/model_id under their snake_case keys, but the handler
    also accepts runId/modelId, so a camelCase body skips the READ check.
  must_find:
  - file: mlflow/server/auth/__init__.py
    lines:
    - 1184
    - 1192
    severity: high
  must_not_flag: []
  accepted:
  - kind: rule
    about: mlflow/server/auth/__init__.py
    statement: Logging dataset inputs or model outputs to a run requires update (EDIT) permission on that run's experiment,
      the same as logging metrics or params.
    pr: 24291
    source: mlflow/server/auth/__init__.py:2466
  - kind: rule
    about: mlflow/server/auth/__init__.py
    statement: A custom review queue may not take a registered username, since it would shadow that user's personal
      queue.
    pr: 24034
    source: mlflow/server/auth/__init__.py:2304
  - kind: rule
    about: mlflow/server/auth/__init__.py
    statement: Any workspace member may list users, but the roster is workspace-scoped so it isn't leaked across workspaces;
      listing grants no access on its own.
    pr: 23935
    source: mlflow/server/auth/__init__.py:1632
  - kind: rule
    about: mlflow/server/auth/__init__.py
    statement: Creating a review queue requires experiment EDIT, and the creator becomes the owner.
    pr: 23910
    source: mlflow/server/auth/__init__.py:2175
  must_propose:
  - kind: decision
    file: mlflow/server/auth/__init__.py
    lines:
    - 1177
    - 1181
    statement: Creating a model version requires READ on the source run/model, to keep create-time access
      consistent with artifact-read gating on the registered model.
  - kind: decision
    file: mlflow/server/auth/__init__.py
    lines:
    - 1186
    - 1188
    statement: The source-read guard keys on presence of run_id/model_id, not truthiness, so an explicitly
      supplied empty id is denied rather than treated as absent.
