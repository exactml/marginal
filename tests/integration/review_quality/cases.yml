    lines:
    - 155
    - 156
    severity: medium
  must_not_flag: []
  accepted:
  - kind: rule
    about: docs/middleware.md
    statement: GZipMiddleware won't compress responses that already have a Content-Encoding (no double encoding)
      or are text/event-stream (server-sent events).
    source: docs/middleware.md:245
  - kind: decision
    about: starlette/middleware/gzip.py
    statement: GZip is not applied to pathsend responses.
    source: starlette/middleware/gzip.py:106
  must_propose:
  - kind: decision
    file: docs/middleware.md
    lines:
    - 244
    - 244
    statement: Body chunks of at least thread_minimum_size (default 128 KiB) are compressed in a worker
      thread; smaller ones compress inline since thread dispatch cost would dominate.
  - kind: decision
    file: starlette/middleware/gzip.py
    lines:
    - 21
    - 22
    statement: GZip compression uses its own capacity limiter, isolated from AnyIO's default worker-thread
      limiter but matching its default concurrency (40).
