  kind: logic
  merged: '2025-08-31'
  source: https://github.com/celery/celery/pull/9863
  evidence: https://github.com/celery/celery/pull/9919
  why: worker_disable_prefetch reads c.task_consumer.channel.qos, which only kombu virtual (Redis) channels
    have; on RabbitMQ the worker raises AttributeError at startup.
  must_find:
  - file: celery/worker/consumer/tasks.py
    lines:
    - 55
    - 56
    severity: medium
  must_not_flag:
  - file: celery/bin/worker.py
    lines:
    - 185
    - 192
  accepted:
  - kind: rule
    about: celery/app/defaults.py
    statement: Queues created automatically for unknown names are classic queues by default; only 'classic' and 'quorum'
      are allowed.
    pr: 9815
    source: celery/app/defaults.py:267
  - kind: decision
    about: celery/app/defaults.py
    statement: From Celery 5.5, the database result backend creates its task and taskset tables when the backend is
      set up, by default, rather than lazily on first task execution.
    pr: 9228
    source: celery/app/defaults.py:257
  - kind: rule
    about: celery/app/defaults.py
    statement: The native delayed delivery queues default to the quorum queue type; 'classic' is the other allowed
      value.
    pr: 9207
    source: celery/app/defaults.py:98
  - kind: rule
    about: docs/userguide/optimizing.rst
    statement: Don't set worker_max_tasks_per_child / worker_max_memory_per_child too low, or workers spend most of
      their time restarting child processes.
    pr: 7186
    source: docs/userguide/optimizing.rst:211
  must_propose:
  - kind: rule
    file: docs/userguide/configuration.rst
    lines:
    - 3210
    - 3213
    statement: With worker_disable_prefetch (default False) a worker only consumes from the broker when
      a process is free, disabling prefetch while keeping early acks so tasks are fairly distributed.
  - kind: decision
    file: celery/worker/consumer/tasks.py
    lines:
    - 59
    - 60
    statement: With prefetch disabled, the reservation limit is the autoscaler's max_concurrency when set,
      otherwise the pool size.
- id: db-pool-closed-after-each-task-in-thread-pools
  upstream: celery/celery
  base: 273186043cb93bcb2ce82886b54bfbcd7ddb3459
  head: 1ad3bd45369106e22b6aabad047480119140b8ea
  kind: logic
  merged: '2025-10-20'
  source: https://github.com/celery/celery/pull/9953
  evidence: https://github.com/celery/celery/pull/10020
  why: _close_database closes the shared Django connection pool after every task in every worker pool
    type; with threads/gevent other in-flight tasks then fail with "pool is closed".
  must_find:
  - file: celery/fixups/django.py
    lines:
    - 206
    - 208
    severity: high
  must_not_flag: []
  accepted:
  - kind: decision
    about: celery/fixups/django.py
    statement: When a forked worker closes inherited DB connection file descriptors, driver errors are converted to
      Django's error classes via wrap_database_errors so driver-specific interface errors are swallowed rather than
      crashing worker process init.
    pr: 9529
    source: celery/fixups/django.py:176
  - kind: decision
    about: celery/fixups/django.py
    statement: In Django projects, Celery apps use DjangoTask (which adds delay_on_commit / apply_async_on_commit)
      as the default task base class, unless the app was given a custom task class.
    pr: 8491
    source: celery/fixups/django.py:83
  - kind: decision
    about: celery/fixups/django.py
    statement: The Django project directory takes precedence over system modules, so it is prepended to sys.path.
    pr: 5355
    source: celery/fixups/django.py:75
  must_propose:
  - kind: decision
    file: docs/django/first-steps-with-django.rst
    lines:
    - 222
    - 225
    statement: When Django (5.1+) DB connection pooling is enabled, Celery closes the pool in worker processes
      via close_pool, since connections can't be shared across processes.
- id: parser-cancellation-leaves-connection-open
  upstream: aio-libs/aiohttp
  base: f049588a8ab5b6b6757677b539845c63698d61f7
  head: 63a411d09af23a9c9945c03f64285c0310f088f7
  kind: logic
  merged: '2026-02-23'
  source: https://github.com/aio-libs/aiohttp/pull/12130
  evidence: https://github.com/aio-libs/aiohttp/pull/12798
  why: Narrowing data_received's handler to `except Exception` means a CancelledError mid-parse no longer
    closes the transport, leaving a desynchronized connection in the keep-alive pool.
  must_find:
  - file: aiohttp/client_proto.py
    lines:
    - 328
    - 328
    severity: high
  must_not_flag: []
  valid_extra:
  - file: aiohttp/worker.py
    lines:
    - 111
    - 128
  accepted:
  - kind: rule
    about: aiohttp/http_parser.py
    statement: When a chunked transfer-encoding chunk's declared size does not match its actual data (no CRLF right
      after the declared bytes), the server must reject it with TransferEncodingError instead of waiting for more
      data.
    pr: 12119
    source: aiohttp/http_parser.py:894
  - kind: rule
    about: aiohttp/http_parser.py
    statement: Upgrade, Transfer-Encoding and Content-Encoding header values must be pure ASCII before they are matched
      case-insensitively, because Unicode lowercasing can turn non-ASCII characters (e.g. the Kelvin sign) into ASCII
      ones.
    pr: 11886
    source: aiohttp/http_parser.py:644
  - kind: decision
    about: aiohttp/http_parser.py
    statement: The old websocket spec (Sec-WebSocket-Key1) is not supported and is rejected as an invalid header.
