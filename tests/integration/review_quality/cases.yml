- id: disable-prefetch-assumes-virtual-channel-qos
  upstream: celery/celery
  base: 6804ea8615afcdbc95ed68e95b47ae623080fa2b
  head: 246bca18e3c65e6881a4a8fef89dd15e1b506a5f
  kind: logic
  merged: '2025-08-31'
  source: https://github.com/celery/celery/pull/9863
