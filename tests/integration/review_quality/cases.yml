- id: eager-optional-numpy-import-in-approx-eq
  upstream: pytest-dev/pytest
  base: e35f1bfe8b2848cbe674b0390973c9a70c844a4e
  head: 0c454979cc2038bc193eb037e80f658a9183641f
  kind: dependency
  merged: '2025-04-02'
  source: https://github.com/pytest-dev/pytest/pull/13338
  evidence: https://github.com/pytest-dev/pytest/pull/13563
  why: is_bool() runs `import numpy` on every approx comparison, so users who never use numpy pay for
    (and get side effects of) importing it; the rest of approx only checks sys.modules.
  must_find:
  - file: src/_pytest/python_api.py
    lines:
    - 429
    - 434
    severity: low
  must_not_flag: []
  valid_extra:
  - file: changelog/13047.bugfix.rst
    lines:
    - 7
    - 16
  accepted:
  - kind: decision
    about: src/_pytest/python_api.py
    statement: pytest.raises accepts only ExceptionGroup[Exception] and BaseExceptionGroup[BaseException] as generic
      arguments; any other parametrization is an error. Because raises doesn't check the types of child exceptions,
      accepting other parametrizations would look like it does.
    pr: 13134
    source: changelog/13115.improvement.rst:8
  - kind: decision
    about: src/_pytest/python_api.py
    statement: For diff calculations, pytest.approx ignores non-number elements in mixed sequences, but those elements
      still count as mismatches.
