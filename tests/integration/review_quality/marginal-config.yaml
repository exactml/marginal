# The config every benchmark case is reviewed with. The upstream repos have no
# .marginal/config.yaml, so run.py places this one in each case's snapshot,
# with `models.reviewer` set to the attempt's provider and model (cases.yml's
# `attempts`). Everything else stays at marginal's defaults, so the benchmark
# measures what a new user gets, except two opt-in features: proposals, so a
# review also reports the rules and decisions a PR states (scored against
# `must_propose`), and dependency checks, so the dependency cases are reviewed
# with the registry lookups a team would turn on.
version: 1
proposals:
  enabled: true
dependencies:
  check: true
